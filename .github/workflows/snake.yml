name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"    # jalan otomatis tiap hari jam 00:00 UTC
  workflow_dispatch:        # bisa di-trigger manual dari tab Actions
  push:
    branches:
      - main                # jalan ulang tiap kali push ke branch main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: davinmaritza
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
